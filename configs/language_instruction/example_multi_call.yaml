# Multi-call language-instruction pipeline config.
# Run with:
#   uv run python -m pipeline.language_instruction.pipeline \
#     --config configs/language_instruction/example_multi_call.yaml
#
# Each entry under `calls` is an independent generate run on the same
# trajectory. Shared `defaults` apply to every call and can be overridden
# per call. Results are merged (and string-deduped) by step at the end.
#
# `postprocess` is reserved for a future LLM filter/paraphrase pass after
# each call's verified instructions. Keep enabled: false for now.

record: datasets/droid/success/success-00285.tfrecord
example_index: 0
save_images: true
estimate_cost: true
# optional; defaults to outputs/language_instructions/<record>_pipeline_<ts>/
# output: outputs/language_instructions/my_run

defaults:
  provider: qwen
  judge: true
  judge_threshold: 3

calls:
  - name: exhaustive_first_frame
    prompt_template: exhaustive
    max_steps: 1
  - name: spaced_default
    provider: gemini
    step_interval: 25
    num_instructions: 3

postprocess:
  enabled: false
