# Uniqueness by behavioural clustering over the MERGED set.
#
# Per-call filtering uses only the adherence judge. Then uniqueness runs depending
# on `uniqueness.when`:
#   before — cluster each generate call's survivors (before merge)
#   after  — cluster the unified list once after merge (default; catches
#            near-duplicates across different calls)
#
#   .venv/bin/python -m pipeline.language_instruction.pipeline \
#       --config configs/language_instruction/uniqueness_cluster.yaml

record: datasets/droid/success/success-00285.tfrecord
example_index: 0
save_images: true
estimate_cost: true

defaults:
  provider: gemini
  judge: true
  judge_threshold: 4
  max_steps: 1

calls:
  - name: default
    prompt_template: default
    num_instructions: 75
  - name: long_horizon
    prompt_template: long_horizon
    num_instructions: 25
  - name: precision
    prompt_template: precision
    num_instructions: 25

uniqueness:
  enabled: true
  when: before
  provider: gemini
  definition: semantic_groups

# After merge (+ uniqueness): grow the kept list with paraphrases and noisy
# rewrites (misspellings, grammar errors). Text-only; no scene frames.
augment:
  enabled: true
  provider: gemini
  paraphrases_per_instruction: 2
  noisy_per_instruction: 1
