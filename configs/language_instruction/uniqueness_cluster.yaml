# Uniqueness by behavioural clustering over the MERGED set.
#
# Per-call filtering uses only the adherence judge. Then uniqueness runs depending
# on `uniqueness.when`:
#   before — cluster each generate call's survivors (before merge)
#   after  — cluster the unified list once after merge (default; catches
#            near-duplicates across different calls)
#
#   .venv/bin/python -m pipeline.language_instruction.pipeline \
#       --config configs/language_instruction/uniqueness_cluster.yaml

record: datasets/droid/success/success-00285.tfrecord
example_index: 0
# The clustering judge is shown these frames so it can resolve object references
# ("the black mug" vs "the black cup") against the actual scene.
save_images: true
estimate_cost: true

defaults:
  provider: gemini
  judge: true
  judge_threshold: 4
  max_steps: 1

calls:
  - name: default
    prompt_template: default
    num_instructions: 75
  - name: long_horizon
    prompt_template: long_horizon
    num_instructions: 25
  - name: precision
    prompt_template: precision
    num_instructions: 25

uniqueness:
  enabled: true
  # One of: before | after
  when: before
  provider: gemini
  # Same action, same objects, same *stated* destination; the image is used only
  # to tell whether two descriptions name the same object. Compare alternatives
  # with scripts/tune_uniqueness_prompt.py.
  definition: semantic_groups

postprocess:
  enabled: false
